[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-scrub"
version = "0.5.0"
description = "Rule-based de-identification and pseudonymisation for Traditional Chinese (Taiwan) clinical text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Po-Wei Chen" }]
keywords = ["de-identification", "phi", "clinical", "traditional-chinese", "taiwan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Traditional)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/drpwchen/chart-scrub"
Demo = "https://drpwchen.github.io/chart-scrub/"

[project.scripts]
chart-scrub = "chart_scrub.cli:main"

[tool.setuptools]
packages = ["chart_scrub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
